<!DOCTYPE html>
<!--
  signup.html — creating a delegate account

  What this page is:
  Where a student creates their BridgeMUN account and claims a
  delegation. Nobody can reach the board without an account, so this is
  one of the two doors into the platform (the other is login.html).

  The behaviour for this page lives in signup.js.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BridgeMUN — Create Delegate Account</title>
  <!-- A heavy slab serif for titles only — see --font-official in
       style.css. Loaded from Google Fonts so it looks the same on
       every computer, not just ones with Rockwell installed. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <main class="auth-card">

    <!-- The emblem and title, matching every other page so they all
         read as one platform. -->
    <div class="auth-brand">
      <svg class="emblem" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="32" cy="32" r="17" stroke="#c9a227" stroke-width="1.4"/>
        <ellipse cx="32" cy="32" rx="7.5" ry="17" stroke="#c9a227" stroke-width="1.1"/>
        <path d="M15 32h34M18 23h28M18 41h28" stroke="#c9a227" stroke-width="1.1"/>
        <path d="M20 52a24 24 0 0 1-8-19" stroke="#e6d08a" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M44 52a24 24 0 0 0 8-19" stroke="#e6d08a" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <p class="platform-name">BridgeMUN</p>
      <h1 class="auth-title">Create Delegate Account</h1>
      <p class="auth-subtitle">United Nations Security Council · Regulation of Autonomous Weapons</p>
    </div>

    <!-- Where errors and confirmations appear. Empty until needed. -->
    <p class="notice" id="notice"></p>

    <!-- SIGN UP: creates the account and claims a delegation. -->
    <form class="auth-form" id="signupForm">
      <label class="field">
        <span class="field-label">Delegate name</span>
        <input type="text" id="signupName" autocomplete="name" placeholder="e.g. Allison Kim" required>
      </label>

      <label class="field">
        <span class="field-label">Delegation</span>
        <!-- The choices are filled in by signup.js from the shared
             country list, so this form and the roster always match. -->
        <select id="signupCountry" required>
          <option value="">Choose a delegation…</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" id="signupEmail" autocomplete="email" required>
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="signupPassword" autocomplete="new-password" placeholder="At least 6 characters" required>
      </label>

      <button class="btn btn-primary btn-block" type="submit">Create delegate account</button>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>

    <p class="auth-footnote">BridgeMUN · Prototype</p>
  </main>

  <!-- type="module" lets this file import the shared code above. -->
  <script type="module" src="signup.js"></script>
</body>
</html>
