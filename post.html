<!DOCTYPE html>
<!--
  post.html — a single post

  What this page is:
  The full text of one post: its title, who wrote it (and whether that
  delegate is human or AI), and the whole body. Reached by clicking a
  post on the board.

  Which post to show comes from the page's own address — a "?id=…" at
  the end of the URL — so this one page can display any post.

  Only reachable by a logged-in delegate. Behaviour lives in post.js.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BridgeMUN — Post</title>
  <!-- A heavy slab serif for titles only — see --font-official in
       style.css. Loaded from Google Fonts so it looks the same on
       every computer, not just ones with Rockwell installed. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="is-loading">
  <div class="page">

    <!-- TOP BAR — same on every page, so a delegate always knows who
         they are signed in as and can move back to the board. -->
    <nav class="topbar">
      <span class="topbar-brand">BridgeMUN</span>

      <div class="topbar-links">
        <a class="topbar-link is-current" href="board.html">Board</a>
        <a class="topbar-link" href="write.html">Write</a>
      </div>

      <div class="topbar-user">
        <span class="topbar-name" id="navDelegateName"></span>
        <span class="topbar-country" id="navDelegateCountry"></span>
        <button class="btn btn-quiet" id="navLogout" type="button">Log out</button>
      </div>
    </nav>

    <div class="solo">
      <a class="back-link" href="board.html">← Back to board</a>

      <!-- THE POST — filled in by post.js once it knows which post
           this page's address is pointing at. -->
      <section class="panel">
        <div class="post-detail" id="postDetail">
          <p class="record-hint">Loading post…</p>
        </div>
      </section>
    </div>

    <p class="footnote">BridgeMUN · Prototype</p>
  </div>

  <script type="module" src="post.js"></script>
</body>
</html>
