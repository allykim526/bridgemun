<!DOCTYPE html>
<!--
  login.html — the door into BridgeMUN

  What this page is:
  Where a student either creates a delegate account (choosing the
  delegation they will represent) or logs back into an existing one.
  Nobody can reach the committee room without passing through here.

  The behaviour for this page lives in login.js.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BridgeMUN — Delegate Access</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

  <main class="auth-card">

    <!-- The emblem and title, matching the committee room's header so
         the two pages read as one platform. -->
    <div class="auth-brand">
      <svg class="emblem" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <circle cx="32" cy="32" r="17" stroke="#c9a227" stroke-width="1.4"/>
        <ellipse cx="32" cy="32" rx="7.5" ry="17" stroke="#c9a227" stroke-width="1.1"/>
        <path d="M15 32h34M18 23h28M18 41h28" stroke="#c9a227" stroke-width="1.1"/>
        <path d="M20 52a24 24 0 0 1-8-19" stroke="#e6d08a" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M44 52a24 24 0 0 0 8-19" stroke="#e6d08a" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <p class="platform-name">BridgeMUN</p>
      <h1 class="auth-title">Delegate Access</h1>
      <p class="auth-subtitle">United Nations Security Council · Regulation of Autonomous Weapons</p>
    </div>

    <!-- The two tabs: log in, or create an account. -->
    <div class="tabs">
      <button class="tab is-active" id="tabLogin" type="button">Log in</button>
      <button class="tab" id="tabSignup" type="button">Sign up</button>
    </div>

    <!-- Where errors and confirmations appear. Empty until needed. -->
    <p class="notice" id="notice"></p>

    <!-- LOG IN: for a delegate who already has an account. -->
    <form class="auth-form" id="loginForm">
      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" id="loginEmail" autocomplete="email" required>
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </label>

      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>

    <!-- SIGN UP: creates the account and claims a delegation. -->
    <form class="auth-form is-hidden" id="signupForm">
      <label class="field">
        <span class="field-label">Delegate name</span>
        <input type="text" id="signupName" autocomplete="name" placeholder="e.g. Allison Kim" required>
      </label>

      <label class="field">
        <span class="field-label">Delegation</span>
        <!-- The choices are filled in by login.js from the shared
             country list, so this form and the roster always match. -->
        <select id="signupCountry" required>
          <option value="">Choose a delegation…</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" id="signupEmail" autocomplete="email" required>
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <input type="password" id="signupPassword" autocomplete="new-password" placeholder="At least 6 characters" required>
      </label>

      <button class="btn btn-primary btn-block" type="submit">Create delegate account</button>
    </form>

    <p class="auth-footnote">BridgeMUN · Prototype</p>
  </main>

  <!-- type="module" lets this file import the shared code above. -->
  <script type="module" src="login.js"></script>
</body>
</html>
