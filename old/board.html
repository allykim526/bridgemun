<!DOCTYPE html>
<!--
  board.html — the committee board

  What this page is:
  Where delegations post longer written pieces that sit outside the live
  debate: draft resolutions, position papers, notices. Each post has a
  title and a body, and the body can be dictated with the record button
  instead of typed.

  Only reachable by a logged-in delegate. Behaviour lives in board.js.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BridgeMUN — Committee Board</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="is-loading">
  <div class="page">

    <!-- TOP BAR — same on every page, so a delegate always knows who
         they are signed in as and can move between the two rooms. -->
    <nav class="topbar">
      <span class="topbar-brand">BridgeMUN</span>

      <div class="topbar-links">
        <a class="topbar-link" href="index.html">Committee</a>
        <a class="topbar-link is-current" href="board.html">Board</a>
      </div>

      <div class="topbar-user">
        <span class="topbar-name" id="navDelegateName"></span>
        <span class="topbar-country" id="navDelegateCountry"></span>
        <button class="btn btn-quiet" id="navLogout" type="button">Log out</button>
      </div>
    </nav>

    <!-- PAGE HEADER — narrower than the committee room's, since the
         board is a quieter, secondary space. -->
    <header class="committee-header is-compact">
      <div class="header-inner">
        <div>
          <p class="platform-name">BridgeMUN</p>
          <h1 class="committee-name">Committee Board</h1>
          <p class="committee-topic">
            Draft resolutions, position papers, and notices from the delegations of the
            <strong>United Nations Security Council</strong>.
          </p>
        </div>
      </div>
    </header>

    <div class="board">

      <!-- WRITING A POST -->
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">New Post</h2>
          <span class="panel-count">Posting as <span id="composerWho"></span></span>
        </div>

        <form class="composer" id="postForm">
          <div class="composer-head">
            <span class="composer-label">Title</span>
            <span class="record-hint" id="recordHint"></span>
          </div>

          <input
            class="composer-title"
            id="postTitle"
            type="text"
            maxlength="120"
            placeholder="e.g. Draft Resolution 1.1 — Human Control Standards">

          <label class="composer-label composer-label-block" for="postBody">Body</label>
          <textarea
            class="composer-input"
            id="postBody"
            rows="6"
            placeholder="Write your post, or press Record and speak it aloud…"></textarea>

          <div class="composer-actions">
            <button class="btn btn-record" id="recordButton" type="button">
              <span class="record-dot"></span>
              <span class="record-label">Record</span>
            </button>

            <button class="btn btn-primary" id="postButton" type="submit" disabled>
              Publish post
            </button>
          </div>
        </form>
      </section>

      <!-- THE POSTS THEMSELVES — newest first, drawn by board.js. -->
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-title">Posts</h2>
          <span class="panel-count" id="postCount"></span>
        </div>

        <div class="post-list" id="postList"></div>
      </section>

    </div>

    <p class="footnote">BridgeMUN · Prototype</p>
  </div>

  <script type="module" src="board.js"></script>
</body>
</html>
